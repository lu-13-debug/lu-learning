<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>好物商店 电商测试练习</title>
<style>
:root{--ink:#1b2b40;--muted:#6a7888;--green:#166859;--line:#e2e8e6;--paper:#f6f8f6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--green);color:white;padding:9px 16px}button:hover{filter:brightness(.94)}button:disabled{background:#a9b6b1;cursor:not-allowed}input{border:1px solid #cad6d0;border-radius:7px;padding:9px;width:100%;background:#fff;color:var(--ink)}input:focus,button:focus-visible{outline:3px solid #a0cdbd;outline-offset:2px}header{background:white;border-bottom:1px solid var(--line)}.header{max-width:1180px;margin:auto;padding:24px 22px;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:28px;margin:0;font-weight:700;letter-spacing:1px}.eyebrow{font-size:12px;color:var(--green);letter-spacing:2px}.subtitle{color:var(--muted);font-size:13px;margin:3px 0 0}.auth{display:flex;align-items:end;gap:10px}.auth label{font-size:12px;display:block;color:var(--muted)}.auth input{width:145px;padding:7px 9px}.hint{font-size:12px;color:var(--muted)}main{max-width:1180px;margin:28px auto;padding:0 22px}.banner{display:flex;align-items:center;justify-content:space-between;gap:30px;background:#e6efea;border-radius:12px;padding:25px 28px;margin-bottom:24px}.banner h2{font-size:22px;margin:0 0 6px}.banner p{margin:0;color:#47655b}.pill{padding:6px 12px;background:#fff;border-radius:20px;white-space:nowrap;font-size:12px;color:var(--green)}.layout{display:grid;grid-template-columns:1fr 340px;gap:24px}.search{display:flex;gap:10px;margin-bottom:12px}.search input{flex:1}.caption{font-size:12px;color:var(--muted);margin:9px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.product{padding:18px}.art{height:118px;display:flex;align-items:center;justify-content:center;background:#eef2ee;font-size:53px}.art[data-id="2"]{background:#f5eee2}.art[data-id="3"]{background:#eef0f7}.art[data-id="4"]{background:#f5eae5}.category{font-size:11px;color:var(--muted);margin-top:14px}.product h3{margin:5px 0 12px;font-size:17px}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:21px;font-weight:650;color:var(--green)}.stock{font-size:11px;color:var(--muted);margin:10px 0 0}.side{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;align-self:start}.side h2{font-size:18px;margin:0 0 16px}.empty{color:var(--muted);font-size:13px;padding:22px 0}.cart-row{border-bottom:1px solid var(--line);padding:12px 0}.cart-row strong{display:block;font-size:14px}.cart-controls{display:flex;align-items:center;gap:7px;margin-top:8px}.cart-controls input{width:65px;padding:6px}.small{padding:6px 10px;font-size:12px}.ghost{background:#edf3ef;color:var(--green)}.total{text-align:right;font-size:19px;font-weight:650;margin:18px 0}.side label{font-size:12px;color:var(--muted)}.submit{width:100%;margin:12px 0 0}#notice{margin:0 0 18px;padding:10px 15px;border-radius:8px;background:#fff2de;color:#795217;min-height:44px}.success{color:#166859;font-size:13px;margin-top:12px}.order{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}footer{color:var(--muted);font-size:12px;margin:25px 0}.section-label{font-size:13px;color:var(--muted);margin:22px 0 8px}.hidden{display:none!important}@media(max-width:850px){.header{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.auth{flex-wrap:wrap}.banner{padding:20px}.grid{gap:12px}.product-bottom{align-items:start;flex-direction:column}.side{width:100%}}
</style></head>
<body>
<header><div class="header"><div><div class="eyebrow">EVERYDAY GOODS</div><h1>好物商店</h1><p class="subtitle">本地学习靶场 · 无真实支付</p></div>
<div><form id="login-form" class="auth" novalidate><div><label for="username">用户名</label><input id="username" autocomplete="username" placeholder="demo"></div><div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="Demo123!"></div><button type="submit">登录</button></form><div id="logged-in" class="hidden">演示账号 demo <button id="logout" class="ghost small">退出登录</button></div><div class="hint">演示账号 demo / Demo123! · 每次登录独立练习空间</div></div>
</div></header>
<main><div class="banner"><div><h2>从发现好物，到安心下单</h2><p>搜索、加购、修改数量、确认地址，体验完整购物流程。</p></div><span class="pill">4 件精选商品</span></div>
<div id="notice" role="status" aria-live="polite">欢迎体验电商购物流程</div>
<div class="layout"><section aria-label="商品列表"><form id="search-form" class="search"><input id="search" aria-label="搜索商品" placeholder="搜索键盘、保温杯等商品"><button type="submit">搜索</button></form><div id="results-caption" class="caption" data-testid="results-caption">正在加载商品</div><div id="products" class="grid"></div></section>
<aside class="side"><h2>我的购物车</h2><div id="cart-items"><div class="empty">购物车还是空的</div></div><div id="cart-total" class="total">合计 ¥0.00</div><label for="address">收货地址</label><input id="address" placeholder="填写8到200个字符的演示地址" maxlength="200"><button id="checkout" class="submit">提交订单</button><div id="order-success" class="success hidden" data-testid="order-success"></div><div class="section-label">订单记录</div><div id="orders"><div class="hint">登录后可查看本次练习的订单</div></div></aside></div>
<footer>个人实战项目 · 页面与接口仅用于自动化测试练习 · 数据均为演示数据</footer></main>
<script>
const $=id=>document.getElementById(id);const money=c=>(c/100).toFixed(2);let authenticated=false;let requestKey=crypto.randomUUID();
function note(message){$('notice').textContent=message;}
async function api(url,data){const response=await fetch(url,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const value=await response.json();if(!response.ok)throw new Error(value.error||'请求失败');return value;}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
async function showProducts(query=''){
const products=await api('/api/products?q='+encodeURIComponent(query));$('products').replaceChildren();
if(!products.length)$('products').append(node('div','未找到匹配商品','empty'));
for(const p of products){const wrapper=node('div',undefined,'card');wrapper.dataset.testid='product-card';const card=node('article',undefined,'product');card.dataset.testid='product-'+p.id;const art=node('div',({1:'⌨',2:'☕',3:'💡',4:'👜'})[p.id],'art');art.dataset.id=p.id;art.setAttribute('aria-hidden','true');card.append(art,node('div',p.category,'category'),node('h3',p.name));const bottom=node('div',undefined,'product-bottom');const button=node('button','加入购物车');button.disabled=p.stock===0;button.onclick=async()=>{try{await api('/api/cart/add',{product_id:p.id,quantity:1});await showCart();note('已加入购物车');}catch(e){note(e.message);}};bottom.append(node('span','¥'+money(p.price_cents),'price'),button);card.append(bottom,node('div',p.stock?'有货 · 单件最多20件':'暂时售罄','stock'));wrapper.append(card);$('products').append(wrapper);}
$('results-caption').textContent=query?`搜索“${query}”：${products.length} 件商品`:`全部商品：${products.length} 件`;
}
async function showCart(){const cart=authenticated?await api('/api/cart'):{items:[],total_cents:0};$('cart-items').replaceChildren();if(!cart.items.length)$('cart-items').append(node('div','购物车还是空的','empty'));for(const p of cart.items){const row=node('div',undefined,'cart-row');row.dataset.testid='cart-'+p.id;row.append(node('strong',p.name),node('span','¥'+money(p.price_cents),'hint'));const controls=node('div',undefined,'cart-controls');const input=node('input');input.type='number';input.value=p.quantity;input.setAttribute('aria-label','商品数量');const update=node('button','更新','small ghost');update.onclick=async()=>{try{await api('/api/cart/update',{product_id:p.id,quantity:Number(input.value)});await showCart();note('数量已更新');}catch(e){note(e.message);}};const remove=node('button','移除','small ghost');remove.onclick=async()=>{try{await api('/api/cart/remove',{product_id:p.id});await showCart();note('商品已移除');}catch(e){note(e.message);}};controls.append(input,update,remove);row.append(controls);$('cart-items').append(row);}$('cart-total').textContent='合计 ¥'+money(cart.total_cents);}
async function showOrders(){const orders=await api('/api/orders');$('orders').replaceChildren();for(const o of orders)$('orders').append(node('div',`订单 #${o.id} · ¥${money(o.total_cents)}`,'order'));if(!orders.length)$('orders').append(node('div','暂无订单','hint'));}
function showAuth(){ $('login-form').classList.toggle('hidden',authenticated);$('logged-in').classList.toggle('hidden',!authenticated); }
$('login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{username:$('username').value,password:$('password').value});authenticated=true;showAuth();await showCart();await showOrders();note('登录成功');}catch(error){note(error.message);}};
$('logout').onclick=async()=>{try{await api('/api/logout',{});authenticated=false;showAuth();await showCart();$('orders').replaceChildren(node('div','登录后可查看本次练习的订单','hint'));$('order-success').classList.add('hidden');note('已退出登录');}catch(e){note(e.message);}};
$('search-form').onsubmit=async e=>{e.preventDefault();try{await showProducts($('search').value.trim());}catch(error){note(error.message);}};
$('checkout').onclick=async()=>{const button=$('checkout');button.disabled=true;try{const order=await api('/api/checkout',{address:$('address').value,request_key:requestKey});requestKey=crypto.randomUUID();await showCart();await showOrders();await showProducts($('search').value.trim());$('order-success').textContent=`下单成功，订单编号 ${order.id}`;$('order-success').dataset.orderId=order.id;$('order-success').classList.remove('hidden');note('订单提交成功');}catch(e){note(e.message);}finally{button.disabled=false;}};
(async()=>{try{authenticated=(await api('/api/me')).authenticated;showAuth();await showProducts();if(authenticated){await showCart();await showOrders();}}catch(e){note(e.message);}})();
</script></body></html>
